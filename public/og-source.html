<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #050505;
    background-image:
      linear-gradient(rgba(255,255,255,0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.055) 1px, transparent 1px);
    background-size: 48px 48px;
    font-family: "Roboto Mono", "SF Mono", Menlo, monospace;
    color: #F2F2F2;
    position: relative;
  }
  .chip {
    position: absolute; background: #0A0A0A; border: 2px solid #FFF;
    border-radius: 999px; padding: 8px 20px; font-weight: 700; font-size: 22px;
  }
  .card {
    position: absolute; left: 90px; top: 110px; width: 660px;
    background: #0A0A0A; border: 3px solid #FFF; border-radius: 30px;
    padding: 46px 50px; box-shadow: 0 10px 40px rgba(0,0,0,0.7);
  }
  h1 { font-size: 44px; font-weight: 500; line-height: 1.3; color: #F2F2F2; }
  p { font-size: 23px; font-weight: 400; margin-top: 20px; line-height: 1.55; color: #9CA3AF; }
  .cta {
    display: inline-block; margin-top: 32px; background: #FFF; color: #000;
    font-weight: 500; font-size: 22px; padding: 12px 30px; border-radius: 999px;
  }
  .st {
    position: absolute; background: #fff; border: 2.5px solid #FFF;
    border-radius: 20px; padding: 12px; font-size: 44px; line-height: 1;
    box-shadow: 4px 6px 14px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
  <div class="chip" style="left:48px; top:44px;">🍜 @eatrovert_</div>
  <div class="chip" style="right:48px; top:44px; background:#E4572E; border-color:#FFF; color:#fff;">Mukbang • ASMR</div>

  <div class="st" style="left:810px; top:130px; transform:rotate(-8deg);">🍜</div>
  <div class="st" style="left:940px; top:95px; transform:rotate(10deg);">🍔</div>
  <div class="st" style="left:1070px; top:185px; transform:rotate(-6deg);">🧋</div>
  <div class="st" style="left:870px; top:290px; transform:rotate(8deg);">🔥</div>
  <div class="st" style="left:1030px; top:370px; transform:rotate(-10deg);">🥟</div>
  <div class="st" style="left:950px; top:490px; transform:rotate(6deg);">🍰</div>
  <div class="st" style="left:790px; top:530px; transform:rotate(-5deg);">☕</div>
  <div class="st" style="left:44px; top:440px; transform:rotate(6deg); font-size:36px;">🎧</div>

  <div class="card">
    <h1>Hii, Aku @eatrovert_ 🍜</h1>
    <p>Konten kreator makanan — mukbang &amp; ASMR tiap hari.</p>
    <p>100K+ likes di TikTok · seri Day 1–55+ tanpa skip.</p>
    <span class="cta">Follow di TikTok ↗</span>
  </div>

  <div style="position:absolute; left:92px; bottom:42px; font-weight:500; font-size:18px; color:#9CA3AF;">
    eatrovert.my.id
  </div>
</body>
</html>
